<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercell ID</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="icon.png">
</head>
<body>
    <main class="card">
        <div class="logo">SUPERCELL <span>ID</span></div>
        <div class="steps"><span>Register</span><span class="muted">Finish</span></div>
        <div class="progress"></div>
        <h1>Create a Supercell ID</h1>
        <p class="intro">Enter your details to create an account.</p>
        <form action="register-success.html">
            <input type="text" placeholder="First name" aria-label="Ime" required>
            <input type="text" placeholder="Last name" aria-label="Priimek" required>
            <input type="email" placeholder="Enter your email" aria-label="E-pošta" required>
            <input type="password" placeholder="Create a password" aria-label="Geslo" minlength="8" required>
            <input type="password" placeholder="Confirm password" aria-label="Potrditev gesla" minlength="8" required>
            <p id="password-error" style="display:none;color:red;">
            Passwords do not match.
            </p>
            <label for="birthdate">Date of birth</label>
            <input type="date" id="birthdate"
               aria-label="Datum rojstva"
               min="1900-01-01"
               max="2026-10-20"
               required>
            <button class="btn primary" type="submit">REGISTER</button>
        </form>
        <a class="btn secondary" href="index.html">CANCEL</a>
        <a class="register-link" href="index.html">Already have an account? Log in</a>
    </main>
<footer class="footer">
    <span class="language">English⌄</span>
    <a href="index.html">Privacy Policy</a>
    <a href="index.html">Terms of Service</a>
    <a href="index.html">Manage Cookies</a>
    <span class="watermark">SUP<br>ERC<br>ELL</span>
</footer>
</body>
</html>
